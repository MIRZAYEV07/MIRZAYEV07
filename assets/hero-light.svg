<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Ogabek Mirzoyev — Senior Backend Engineer, high-load and real-time data systems. Python, FastAPI, Django, PostgreSQL, ClickHouse. Tashkent, Uzbekistan. 40M+ registered in uzbekistan's national census: population + agriculture · end to end, from pre-census to the final count. 15M+ user activities handled (census.stat.uz). 8K+ rps during the census (census.stat.uz). 5+ TB in real-time statistics (PostgreSQL + ClickHouse). 50K+ daily active users (census + pre-census). 2.5K+ rps on the auth service (minisurvey.stat.uz). 2,000+ stations registered, licensed (ugaz.uz · live, per dispenser).">
